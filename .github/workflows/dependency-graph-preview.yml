name: Dependency Graph Preview

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Pull request code must never receive repository-write scope merely to inspect dependencies.
permissions:
  contents: read

jobs:
  generate-dependency-graph:
    name: Generate Gradle Dependency Graph Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate dependency graph without repository submission
        uses: gradle/actions/dependency-submission@v6
        with:
          # The action enables its dependency-graph plugin for this dedicated Gradle invocation.
          # Graph data remains an artifact on pull requests; only trusted default-branch pushes
          # submit snapshots with contents: write in android.yml.
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
