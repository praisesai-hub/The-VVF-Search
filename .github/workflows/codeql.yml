name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]
        build-mode: ["manual"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL must observe a fresh Kotlin compilation between init and analyze.
      # The hosted extractor currently supports Kotlin versions below 2.4.20,
      # while the production graph uses the patched Kotlin 2.4.20-RC release.
      # Prepare a workspace-only compatibility copy; Android CI, dependency
      # submission, release gates, and shipped artifacts keep the production graph.
      - name: Prepare CodeQL Kotlin compatibility workspace
        run: python3 scripts/prepare_codeql_compatibility.py --supported-version 2.3.21
      - name: Build for CodeQL analysis
        run: |
          ./gradlew --no-daemon --no-build-cache :app:clean :app:assembleDebug \
            -Pkotlin.incremental=false \
            -Dkotlin.caching.enabled=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
