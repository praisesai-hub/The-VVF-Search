name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]
        build-mode: ["manual"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # Kotlin 2.4.20-Beta1 is the first patched version for GHSA-r937-wjx7-w2jp.
          # Use the latest CodeQL nightly until the recommended stable bundle supports it.
          tools: nightly
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL must observe a fresh Kotlin compilation between init and analyze.
      # Clean/no-cache/incremental-disabled inputs provide that guarantee without
      # forcing Kotlin's in-process compiler, which is ABI-incompatible with the
      # Compose compiler registrar in the current verified Kotlin toolchain.
      - name: Build for CodeQL analysis
        run: |
          ./gradlew --no-daemon --no-build-cache :app:clean :app:assembleDebug \
            -Pkotlin.incremental=false \
            -Dkotlin.caching.enabled=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
