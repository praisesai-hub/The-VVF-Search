name: Automatic Dependency Submission (Gradle)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    name: submit-gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Ensure valid gradle-wrapper.jar
        run: |
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "gradle-wrapper.jar is invalid or missing, generating a fresh wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "google-services.json is not configured; dependency graph submission does not require it."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate and Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4
