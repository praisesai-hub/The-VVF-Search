name: Automatic Dependency Submission (Gradle)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-gradle-pr:
    name: submit-gradle
    if: github.event_name == "pull_request" || (github.event_name == "workflow_dispatch" && github.ref != "refs/heads/main" && github.ref != "refs/heads/master")
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Validate resolved dependencies without submission
        run: ./gradlew --no-daemon --stacktrace :app:dependencies --configuration debugRuntimeClasspath

  submit-gradle-main:
    name: submit-gradle-main
    if: (github.event_name == "push" && (github.ref == "refs/heads/main" || github.ref == "refs/heads/master")) || (github.event_name == "workflow_dispatch" && (github.ref == "refs/heads/main" || github.ref == "refs/heads/master"))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf "%s" "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "google-services.json is not configured; dependency graph submission does not require it."
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Generate and Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6
