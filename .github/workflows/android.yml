# Android CI/CD Pipeline - Automated Build & Test
name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.3.1'

defaults:
  run:
    shell: bash

jobs:
  dependency-submission:
    name: Submit Resolved Gradle Dependency Graph
    # The Dependency Submission API mutates only GitHub's dependency inventory.
    # It never runs for pull requests and retains write permission only in this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Submit resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false

  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        validate-wrappers: true
    - name: Verify Gradle Wrapper
      run: |
        test -f gradle/wrapper/gradle-wrapper.jar
        test -f gradle/wrapper/gradle-wrapper.properties
        ./gradlew --version
        ./gradlew -q properties >/dev/null
        echo "Gradle wrapper resolved successfully."
    - name: Enforce tracked-secret policy
      run: python3 scripts/check_no_secrets.py
    - name: Test weekly security health policy
      run: PYTHONPATH=scripts python3 -m unittest scripts/test_weekly_security_health.py
    - name: Write google-services.json from secret (if set)
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        fi
    - name: Verify google-services.json (optional for CI validation)
      run: |
        if [ -f app/google-services.json ] && [ -s app/google-services.json ]; then
          echo "google-services.json present."
        else
          echo "Notice: google-services.json is not available. Continuing because the Android project uses MissingGoogleServicesStrategy.WARN; Firebase configuration is not required for compile/test validation."
        fi
    - name: Create .env File
      run: |
        if [ -n "${{ secrets.ENV_FILE_CONTENT }}" ]; then
          printf '%s' "${{ secrets.ENV_FILE_CONTENT }}" > .env
        else
          : > .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            printf '%s\n' "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi
        fi
    - name: Resolve and validate runtime dependency graphs
      run: |
        reports_dir="app/build/reports/dependency-compatibility"
        mkdir -p "$reports_dir"
        printf 'revision=%s\n' "$GITHUB_SHA" > "$reports_dir/metadata.txt"
        ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > "$reports_dir/releaseRuntimeClasspath.txt"
        ./gradlew :app:dependencies --configuration debugRuntimeClasspath > "$reports_dir/debugRuntimeClasspath.txt"
        python3 scripts/verify_dependency_compatibility.py \
          --reports-dir "$reports_dir" \
          --expected-revision "$GITHUB_SHA" \
          --manifest gradle/libs.versions.toml \
          --manifest app/build.gradle.kts
        python3 scripts/verify_release_runtime_security.py \
          --report "$reports_dir/releaseRuntimeClasspath.txt" \
          --policy scripts/release-runtime-security-policy.txt
        PYTHONPATH=scripts python3 -m unittest scripts/test_verify_release_runtime_security.py
    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest
    - name: Upload JVM Unit Test Diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jvm-unit-test-diagnostics
        path: |
          app/build/test-results/testDebugUnitTest
          app/build/reports/tests/testDebugUnitTest
          app/build/reports/problems
        if-no-files-found: warn
    - name: Generate JVM Unit Test Coverage Report
      run: ./gradlew :app:createDebugUnitTestCoverageReport
    - name: Enforce JVM Unit Test Coverage Floor
      run: |
        python3 scripts/check_coverage_floor.py \
          --report app/build/reports/coverage/test/debug/report.xml \
          --minimum-instruction-percent 5.0
    - name: Upload JVM Unit Test Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jvm-unit-test-coverage
        path: app/build/reports/coverage/test/debug
        if-no-files-found: error
    - name: Run Lint
      run: ./gradlew :app:lintDebug
    - name: Run Detekt
      run: ./gradlew :app:detekt
    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug
    - name: Build unsigned release AAB for validation
      # Production signing credentials are deliberately unavailable to push and PR CI.
      run: |
        unset KEYSTORE_PATH STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
        ./gradlew :app:bundleRelease \
          -PversionCode=${{ github.run_number }} \
          -PversionName=1.0.${{ github.run_number }}
    - name: Upload Dependency Compatibility Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dependency-compatibility-reports
        path: app/build/reports/dependency-compatibility
        if-no-files-found: error
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    name: Run Instrumented Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Verify Gradle Wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - name: Enforce tracked-secret policy
        run: python3 scripts/check_no_secrets.py
      - name: Write google-services.json from secret (if set)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi
      - name: Verify google-services.json (optional for CI validation)
        run: |
          if [ -f app/google-services.json ] && [ -s app/google-services.json ]; then
            echo "google-services.json present."
          else
            echo "Notice: google-services.json is not available. Continuing because the Android project uses MissingGoogleServicesStrategy.WARN; Firebase configuration is not required for compile/test validation."
          fi
      - name: Create .env File
        run: |
          if [ -n "${{ secrets.ENV_FILE_CONTENT }}" ]; then
            printf '%s' "${{ secrets.ENV_FILE_CONTENT }}" > .env
          else
            : > .env
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              printf '%s\n' "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            fi
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Run Instrumented Tests via Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest :app:createDebugAndroidTestCoverageReport
      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
      - name: Upload Android Test Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-coverage
          path: app/build/reports/coverage/androidTest/debug/connected
          if-no-files-found: warn
