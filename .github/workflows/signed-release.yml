name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name, for example 1.0.42"
        required: true
        type: string
      version_code:
        description: "Positive, monotonically increasing Android version code"
        required: true
        type: string

# One signed release at a time. A newer release request must not cancel an active signing job.
concurrency:
  group: signed-android-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  signed-release-aab:
    name: Build and sign Android App Bundle
    # Release credentials are only made available when this committed workflow is manually run from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the selected main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          # Release signing must not restore or save Gradle User Home state from other jobs.
          # Keep the release job hermetic and independent from mutable Gradle User Home state.
          cache-disabled: true
          add-job-summary: on-failure

      - name: Test release dependency gate scripts
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            scripts/test_release_dependency_gate.py \
            scripts/test_verify_release_runtime_security.py

      - name: Resolve release dependency graphs
        run: |
          set -euo pipefail
          mkdir -p release-security
          printf 'revision=%s\n' "$GITHUB_SHA" > release-security/metadata.txt
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache buildEnvironment \
            > release-security/rootBuildEnvironment.txt
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache :app:buildEnvironment \
            > release-security/appBuildEnvironment.txt
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :app:dependencies --configuration releaseRuntimeClasspath \
            > release-security/releaseRuntimeClasspath.txt
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            :app:dependencies --configuration debugRuntimeClasspath \
            > release-security/debugRuntimeClasspath.txt

      - name: Validate resolved dependency graphs
        run: |
          python3 scripts/verify_dependency_compatibility.py \
            --reports-dir release-security \
            --expected-revision "$GITHUB_SHA" \
            --manifest gradle/libs.versions.toml \
            --manifest build.gradle.kts \
            --manifest app/build.gradle.kts

      - name: Enforce forbidden and critical dependency policy
        run: |
          python3 scripts/check_release_dependency_policy.py \
            --report release-security/rootBuildEnvironment.txt \
            --report release-security/appBuildEnvironment.txt \
            --report release-security/releaseRuntimeClasspath.txt \
            --policy scripts/release-dependency-policy.json
          python3 scripts/verify_release_runtime_security.py \
            --report release-security/releaseRuntimeClasspath.txt \
            --policy scripts/release-runtime-security-policy.txt

      - name: Build resolved dependency inventory and SBOM
        run: |
          python3 scripts/build_release_osv_inventory.py \
            --report release-security/rootBuildEnvironment.txt \
            --report release-security/appBuildEnvironment.txt \
            --report release-security/releaseRuntimeClasspath.txt \
            --output release-security/osv-scanner.json
          python3 scripts/build_release_sbom.py \
            --report release-security/rootBuildEnvironment.txt \
            --report release-security/appBuildEnvironment.txt \
            --report release-security/releaseRuntimeClasspath.txt \
            --output release-security/dependencies.cdx.json

      - name: Scan resolved dependencies with OSV and license policy
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=osv-scanner:release-security/osv-scanner.json
            --format=json
            --output-file=release-security/osv-results.json
            --all-packages
            --licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,CC0-1.0,EDL-1.0,EPL-1.0,EPL-2.0,CDDL-1.0,CDDL-1.1,MPL-1.1,MPL-2.0,LGPL-2.1-only,Zlib

      - name: Upload dependency security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-security-${{ github.run_id }}
          path: release-security
          if-no-files-found: error
          retention-days: 30

      - name: Validate release inputs and required secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          (( VERSION_CODE <= 2100000000 ))
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode and validate upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/vvf-release-upload.jks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          printf 'KEYSTORE_PATH=%s\n' "$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache \
            -Dkotlin.caching.enabled=false \
            -Pkotlin.incremental=false \
            :app:clean :app:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Verify signed AAB and write SHA-256 checksum
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          # Upload certificates are self-signed until Google Play enrolls the app in
          # App Signing. `-strict` treats that trust-chain warning as exit code 4,
          # even when the AAB signature itself is valid. Require jarsigner's positive
          # signature result instead; invalid or unsigned bundles still fail this step.
          VERIFY_OUTPUT="$(jarsigner -verify -certs "$AAB_PATH")"
          printf '%s\n' "$VERIFY_OUTPUT"
          grep -Fqx 'jar verified.' <<< "$VERIFY_OUTPUT"
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp "$AAB_PATH" "$ARTIFACT_DIR/app-release-${VERSION_NAME}-${VERSION_CODE}.aab"
          cp release-security/dependencies.cdx.json "$ARTIFACT_DIR/dependencies.cdx.json"
          (
            cd "$ARTIFACT_DIR"
            sha256sum "app-release-${VERSION_NAME}-${VERSION_CODE}.aab" > "app-release-${VERSION_NAME}-${VERSION_CODE}.aab.sha256"
          )

      - name: Generate signed provenance and SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/app-release-${{ inputs.version_name }}-${{ inputs.version_code }}.aab
          sbom-path: release-artifacts/dependencies.cdx.json

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Securely remove decoded keystore
        if: always()
        run: |
          rm -f "${KEYSTORE_PATH:-$RUNNER_TEMP/vvf-release-upload.jks}"
          rm -rf release-artifacts
